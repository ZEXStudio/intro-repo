<!DOCTYPE html>
<html lang="ja">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>転スラ第4期第2クール最終回時点人気キャラランキング</title>
    <style>
      :root {
        --bg: #0c1220;
        --bg-soft: #101b2d;
        --panel: rgba(17, 24, 39, 0.9);
        --card-hover: rgba(255,255,255,0.09);
        --text: #edf6ff;
        --muted: #bac7d8;
        --green: #34d399;
        --cyan: #67e8f9;
        --gold: #fbbf24;
        --purple: #8b5cf6;
        --pink: #f472b6;
        --shadow: 0 20px 40px rgba(0, 0, 0, 0.35);
      }

      * { box-sizing: border-box; }
      html { scroll-behavior: smooth; }
      body {
        margin: 0;
        font-family: "Segoe UI", "Hiragino Sans", "Yu Gothic", sans-serif;
        background:
          radial-gradient(circle at top, rgba(52, 211, 153, 0.18), transparent 22%),
          radial-gradient(circle at right, rgba(103, 232, 249, 0.12), transparent 30%),
          linear-gradient(180deg, var(--bg) 0%, var(--bg-soft) 100%);
        color: var(--text);
      }
      a { color: inherit; text-decoration: none; }
      .container { max-width: 1180px; margin: 0 auto; padding: 30px 20px 60px; }
      .header { display: flex; justify-content: space-between; align-items: center; gap: 20px; margin-bottom: 26px; }
      .brand { display: flex; align-items: center; gap: 12px; font-weight: 800; letter-spacing: 0.08em; }
      .brand-mark {
        width: 42px; height: 42px; border-radius: 14px; display: grid; place-items: center;
        background: linear-gradient(135deg, var(--green), var(--cyan)); color: #04131d; box-shadow: var(--shadow);
      }
      .nav { display: flex; flex-wrap: wrap; gap: 10px; }
      .nav a { padding: 10px 15px; border-radius: 999px; color: var(--muted); transition: 0.2s ease; }
      .nav a:hover, .nav a.active { background: rgba(255,255,255,0.05); color: var(--text); }

      .hero { display: grid; grid-template-columns: 1.2fr 0.8fr; gap: 24px; margin-bottom: 28px; }
      .hero-main, .hero-side, .card {
        background: var(--panel); border: 1px solid rgba(255,255,255,0.08); border-radius: 24px; box-shadow: var(--shadow);
      }
      .hero-main { position: relative; padding: 28px; overflow: hidden; }
      .hero-main::before {
        content: ""; position: absolute; right: -80px; bottom: -110px; width: 240px; height: 240px;
        border-radius: 50%; background: radial-gradient(circle, rgba(52, 211, 153, 0.32), transparent 65%);
      }
      .eyebrow {
        display: inline-block; padding: 8px 12px; border-radius: 999px; background: rgba(52, 211, 153, 0.12);
        border: 1px solid rgba(52,211,153,0.2); color: #d9fff2; font-size: 0.72rem; font-weight: 700; letter-spacing: 0.08em;
      }
      h1 { margin: 16px 0 12px; font-size: clamp(2.2rem, 4vw, 4.2rem); line-height: 1.08; }
      .subtitle { color: var(--muted); line-height: 1.8; font-size: 1rem; max-width: 620px; }
      .hero-actions { margin-top: 24px; display: flex; flex-wrap: wrap; gap: 12px; }
      .btn { appearance: none; border: 0; border-radius: 12px; padding: 14px 18px; font-weight: 800; cursor: pointer; transition: transform 0.2s ease; }
      .btn:hover { transform: translateY(-1px); }
      .btn-primary { background: linear-gradient(135deg, var(--green), var(--cyan)); color: #04131d; }
      .btn-secondary { background: rgba(255,255,255,0.05); border: 1px solid rgba(255,255,255,0.08); color: var(--text); }
      .hero-side { padding: 24px; display: flex; flex-direction: column; justify-content: center; gap: 16px; }
      .mini-label { color: var(--muted); text-transform: uppercase; letter-spacing: 0.08em; font-size: 0.75rem; }
      .stats { display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 12px; }
      .stat-box { background: rgba(255,255,255,0.04); border: 1px solid rgba(255,255,255,0.08); border-radius: 18px; padding: 16px; }
      .stat-label { display: block; color: var(--muted); font-size: 0.72rem; }
      .stat-value { display: block; margin-top: 8px; font-weight: 800; font-size: 1.8rem; }

      .filters { display: flex; flex-wrap: wrap; gap: 10px; margin: 12px 0 22px; }
      .filter-btn { border: 1px solid rgba(255,255,255,0.08); background: rgba(255,255,255,0.03); color: var(--muted); border-radius: 999px; padding: 10px 14px; cursor: pointer; transition: 0.2s ease; }
      .filter-btn.active, .filter-btn:hover { background: rgba(52, 211, 153, 0.15); border-color: rgba(52,211,153,0.25); color: var(--text); }

      .ranking-grid { display: grid; grid-template-columns: repeat(3, minmax(0, 1fr)); gap: 20px; }
      .card { padding: 18px; transition: transform 0.2s ease, background 0.2s ease; }
      .card:hover { transform: translateY(-2px); background: var(--card-hover); }
      .card-top { display: flex; justify-content: space-between; align-items: center; margin-bottom: 18px; }
      .rank-badge {
        width: 52px; height: 52px; border-radius: 16px; display: grid; place-items: center; font-weight: 800;
        background: linear-gradient(135deg, rgba(52,211,153,0.18), rgba(103,232,249,0.18)); border: 1px solid rgba(255,255,255,0.08);
      }
      .trend { padding: 7px 10px; border-radius: 999px; font-size: 0.74rem; font-weight: 700; background: rgba(52,211,153,0.12); color: #aaf5d5; }
      .trend.down { background: rgba(251, 113, 133, 0.12); color: #ffc0cc; }
      .character-art {
        height: 150px; border-radius: 18px; margin-bottom: 16px; display: flex; align-items: end; padding: 16px;
        background: linear-gradient(135deg, rgba(52,211,153,0.8), rgba(103,232,249,0.7), rgba(139,92,246,0.7));
        color: white; font-weight: 900; letter-spacing: 0.08em;
      }
      .card h3 { margin: 0 0 8px; font-size: 1.2rem; }
      .meta { display: flex; justify-content: space-between; align-items: center; color: var(--muted); font-size: 0.8rem; margin-bottom: 14px; }
      .score { color: var(--gold); font-size: 1.5rem; font-weight: 800; }
      .tags { display: flex; flex-wrap: wrap; gap: 8px; margin-bottom: 14px; }
      .tag { font-size: 0.7rem; padding: 6px 9px; border-radius: 999px; background: rgba(255,255,255,0.05); color: var(--muted); }
      .card-footer { display: flex; justify-content: space-between; align-items: center; gap: 10px; }
      .card-footer small { color: var(--muted); }
      .detail-btn {
        border: 1px solid rgba(255,255,255,0.08); background: rgba(255,255,255,0.03); color: var(--text); padding: 8px 12px;
        border-radius: 10px; cursor: pointer;
      }

      @media (max-width: 960px) { .hero { grid-template-columns: 1fr; } .ranking-grid { grid-template-columns: repeat(2, minmax(0, 1fr)); } }
      @media (max-width: 620px) { .header { flex-direction: column; align-items: flex-start; } .nav { width: 100%; overflow-x: auto; } .ranking-grid { grid-template-columns: 1fr; } }
    </style>
  </head>
  <body>
    <div class="container">
      <header class="header">
        <div class="brand">
          <div class="brand-mark">S</div>
          <span>転スラ人気キャラ</span>
        </div>
        <nav class="nav" aria-label="メニュー">
          <a class="active" href="#">総合</a>
          <a href="#">戦闘</a>
          <a href="#">知略</a>
          <a href="#">魔法</a>
          <a href="#">仲間</a>
        </nav>
      </header>

      <section class="hero">
        <div class="hero-main">
          <span class="eyebrow">ファン投票風</span>
          <h1>転スラ第4期第2クール最終回時点<br>人気キャラランキング</h1>
          <p class="subtitle">
            アニメ第4期第2クール最終回を迎えた時点での人気投票を想定したランキングです。<br>
            リムル中心の勢力図と、ディアブロ・ベニマル・ミリム・ヒナタ・ルミナス・クロエ・クロノアなどの活躍を反映した見た目で、ファン向けの紹介ページとして見やすくまとめています。
          </p>
          <div class="hero-actions">
            <button class="btn btn-primary">ランキングを見る</button>
            <button class="btn btn-secondary">ファン投票</button>
          </div>
        </div>

        <aside class="hero-side">
          <div class="mini-label">今月の統計</div>
          <div class="stats">
            <div class="stat-box"><span class="stat-label">総投票数</span><span class="stat-value">6.2M</span></div>
            <div class="stat-box"><span class="stat-label">平均評価</span><span class="stat-value">98</span></div>
            <div class="stat-box"><span class="stat-label">最注目</span><span class="stat-value">リムル</span></div>
            <div class="stat-box"><span class="stat-label">熱狂度</span><span class="stat-value">96%</span></div>
          </div>
        </aside>
      </section>

      <div class="filters" aria-label="カテゴリーフィルタ">
        <button class="filter-btn active" data-filter="all">総合</button>
        <button class="filter-btn" data-filter="battle">戦闘</button>
        <button class="filter-btn" data-filter="wisdom">知略</button>
        <button class="filter-btn" data-filter="magic">魔法</button>
        <button class="filter-btn" data-filter="ally">仲間</button>
      </div>

      <main id="rankingGrid" class="ranking-grid" aria-live="polite"></main>
    </div>

    <script>
      const items = [
        { rank: 1, name: "リムル", category: "battle", score: 99, trend: "up", votes: 52740, tags: ["統率", "成長", "王者"], label: "No.1" },
        { rank: 2, name: "ディアブロ", category: "wisdom", score: 98, trend: "up", votes: 49860, tags: ["知略", "忠誠", "最高傑作"], label: "最優秀" },
        { rank: 3, name: "ベニマル", category: "battle", score: 97, trend: "up", votes: 47610, tags: ["剣豪", "指揮", "信頼"], label: "超人気" },
        { rank: 4, name: "ミリム", category: "magic", score: 96, trend: "up", votes: 46400, tags: ["爆裂", "友情", "テンション"], label: "熱狂" },
        { rank: 5, name: "ヴェルドラ", category: "magic", score: 95, trend: "up", votes: 45010, tags: ["巨龍", "圧倒", "破壊"], label: "強者" },
        { rank: 6, name: "シュナ", category: "ally", score: 94, trend: "up", votes: 43820, tags: ["癒し", "支配", "優雅"], label: "人気" },
        { rank: 7, name: "ヒナタ", category: "ally", score: 93, trend: "up", votes: 42190, tags: ["優しさ", "仲間", "支え"], label: "支持率" },
        { rank: 8, name: "ルミナス", category: "magic", score: 92, trend: "up", votes: 41440, tags: ["光", "魔法", "希望"], label: "注目" },
        { rank: 9, name: "クロエ", category: "wisdom", score: 91, trend: "up", votes: 40810, tags: ["知力", "冷静", "戦略"], label: "安定" },
        { rank: 10, name: "クロノア", category: "battle", score: 90, trend: "up", votes: 39700, tags: ["勇猛", "守護", "実力"], label: "急伸" },
        { rank: 11, name: "シオン", category: "ally", score: 89, trend: "down", votes: 38960, tags: ["親衛隊", "忠誠", "熱意"], label: "根強い人気" },
        { rank: 12, name: "ソウエイ", category: "wisdom", score: 88, trend: "down", votes: 37420, tags: ["戦略", "忍者", "実力"], label: "安定" },
        { rank: 13, name: "ラミリス", category: "magic", score: 87, trend: "up", votes: 36230, tags: ["魔法", "アイデア", "天才"], label: "注目" },
        { rank: 14, name: "ゴブタ", category: "battle", score: 86, trend: "up", votes: 35180, tags: ["勇敢", "成長", "仲間"], label: "急伸" }
      ];

      const grid = document.getElementById("rankingGrid");
      const filterButtons = document.querySelectorAll(".filter-btn");

      function renderItems(filter = "all") {
        const visible = filter === "all" ? items : items.filter(item => item.category === filter);
        grid.innerHTML = visible.map(item => `
          <article class="card">
            <div class="card-top">
              <div class="rank-badge">#${item.rank}</div>
              <div class="trend ${item.trend === "down" ? "down" : ""}">${item.trend === "up" ? "▲ 上昇" : "▼ 下落"}</div>
            </div>
            <div class="character-art">${item.label}</div>
            <h3>${item.name}</h3>
            <div class="meta">
              <span>${item.votes.toLocaleString()}票</span>
              <span class="score">${item.score}</span>
            </div>
            <div class="tags">${item.tags.map(tag => `<span class="tag">${tag}</span>`).join("")}</div>
            <div class="card-footer">
              <small>カテゴリ: ${item.category}</small>
              <button class="detail-btn">詳細</button>
            </div>
          </article>
        `).join("");
      }

      filterButtons.forEach(button => {
        button.addEventListener("click", () => {
          filterButtons.forEach(btn => btn.classList.remove("active"));
          button.classList.add("active");
          renderItems(button.dataset.filter);
        });
      });

      renderItems();
    </script>
  </body>
</html>
