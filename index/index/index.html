<!DOCTYPE html>
<html lang="ja">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>転スラ第4期第2クール最終回時点人気キャラランキング</title>
  </head>
  <body>
    <div class="container">
      <header class="header">
        <div class="brand">
          <div class="brand-mark">S</div>
          <span>転スラ人気キャラ</span>
        </div>
        <nav class="nav" aria-label="メニュー">
          <a class="active" href="#">総合</a>
          <a href="#">戦闘</a>
          <a href="#">知略</a>
          <a href="#">魔法</a>
          <a href="#">仲間</a>
        </nav>
      </header>

      <section class="hero">
        <div class="hero-main">
          <span class="eyebrow">ファン投票風</span>
          <h1>転スラ第4期第2クール最終回時点<br>人気キャラランキング</h1>
          <p class="subtitle">
            アニメ第4期第2クール最終回を迎えた時点での人気投票を想定したランキングです。<br>
            ライバルや仲間、魔法使い、知略のキャラクターたちを画像付きで見やすくまとめています。
          </p>
          <div class="hero-actions">
            <button class="btn btn-primary">ランキングを見る</button>
            <button class="btn btn-secondary">ファン投票</button>
          </div>
        </div>

        <aside class="hero-side">
          <div class="mini-label">今月の統計</div>
          <div class="stats">
            <div class="stat-box"><span class="stat-label">総投票数</span><span class="stat-value">6.2M</span></div>
            <div class="stat-box"><span class="stat-label">平均評価</span><span class="stat-value">98</span></div>
            <div class="stat-box"><span class="stat-label">最注目</span><span class="stat-value">リムル</span></div>
            <div class="stat-box"><span class="stat-label">熱狂度</span><span class="stat-value">96%</span></div>
          </div>
        </aside>
      </section>

      <div class="filters" aria-label="カテゴリーフィルタ">
        <button class="filter-btn active" data-filter="all">総合</button>
        <button class="filter-btn" data-filter="battle">戦闘</button>
        <button class="filter-btn" data-filter="wisdom">知略</button>
        <button class="filter-btn" data-filter="magic">魔法</button>
        <button class="filter-btn" data-filter="ally">仲間</button>
      </div>

      <main id="rankingGrid" class="ranking-grid" aria-live="polite"></main>
    </div>

    <script>
      const items = [
        { rank: 1, name: "リムル", category: "battle", score: 99, trend: "up", votes: 52740, tags: ["統率", "成長", "王者"], label: "No.1", image: "https://images.unsplash.com/photo-1517841905240-472988babdf9?auto=format&fit=crop&w=900&q=80" },
        { rank: 2, name: "ディアブロ", category: "wisdom", score: 98, trend: "up", votes: 49860, tags: ["知略", "忠誠", "最高傑作"], label: "最優秀", image: "https://images.unsplash.com/photo-1500648767791-00dcc994a43e?auto=format&fit=crop&w=900&q=80" },
        { rank: 3, name: "ベニマル", category: "battle", score: 97, trend: "up", votes: 47610, tags: ["剣豪", "指揮", "信頼"], label: "超人気", image: "https://images.unsplash.com/photo-1504593811423-6dd665756598?auto=format&fit=crop&w=900&q=80" },
        { rank: 4, name: "ミリム", category: "magic", score: 96, trend: "up", votes: 46400, tags: ["爆裂", "友情", "テンション"], label: "熱狂", image: "https://images.unsplash.com/photo-1494790108377-be9c29b29330?auto=format&fit=crop&w=900&q=80" },
        { rank: 5, name: "ヴェルドラ", category: "magic", score: 95, trend: "up", votes: 45010, tags: ["巨龍", "圧倒", "破壊"], label: "強者", image: "https://images.unsplash.com/photo-1506794778202-cad84cf45f1d?auto=format&fit=crop&w=900&q=80" },
        { rank: 6, name: "シュナ", category: "ally", score: 94, trend: "up", votes: 43820, tags: ["癒し", "支配", "優雅"], label: "人気", image: "https://images.unsplash.com/photo-1524504388940-b1c1722653e1?auto=format&fit=crop&w=900&q=80" },
        { rank: 7, name: "ヒナタ", category: "ally", score: 93, trend: "up", votes: 42190, tags: ["優しさ", "仲間", "支え"], label: "支持率", image: "https://images.unsplash.com/photo-1487412720507-e7ab37603c6f?auto=format&fit=crop&w=900&q=80" },
        { rank: 8, name: "ルミナス", category: "magic", score: 92, trend: "up", votes: 41440, tags: ["光", "魔法", "希望"], label: "注目", image: "https://images.unsplash.com/photo-1544005313-94ddf0286df2?auto=format&fit=crop&w=900&q=80" },
        { rank: 9, name: "クロエ", category: "wisdom", score: 91, trend: "up", votes: 40810, tags: ["知力", "冷静", "戦略"], label: "安定", image: "https://images.unsplash.com/photo-1438761681033-6461ffad8d80?auto=format&fit=crop&w=900&q=80" },
        { rank: 10, name: "クロノア", category: "battle", score: 90, trend: "up", votes: 39700, tags: ["勇猛", "守護", "実力"], label: "急伸", image: "https://images.unsplash.com/photo-1521119989659-a83eee488004?auto=format&fit=crop&w=900&q=80" },
        { rank: 11, name: "シオン", category: "ally", score: 89, trend: "down", votes: 38960, tags: ["親衛隊", "忠誠", "熱意"], label: "根強い人気", image: "https://images.unsplash.com/photo-1542204165-65bf26472b9b?auto=format&fit=crop&w=900&q=80" },
        { rank: 12, name: "ソウエイ", category: "wisdom", score: 88, trend: "down", votes: 37420, tags: ["戦略", "忍者", "実力"], label: "安定", image: "https://images.unsplash.com/photo-1504593811423-6dd665756598?auto=format&fit=crop&w=900&q=80" },
        { rank: 13, name: "ラミリス", category: "magic", score: 87, trend: "up", votes: 36230, tags: ["魔法", "アイデア", "天才"], label: "注目", image: "https://images.unsplash.com/photo-1515886657613-9f3515b0c78f?auto=format&fit=crop&w=900&q=80" },
        { rank: 14, name: "ゴブタ", category: "battle", score: 86, trend: "up", votes: 35180, tags: ["勇敢", "成長", "仲間"], label: "急伸", image: "https://images.unsplash.com/photo-1534528741775-53994a69daeb?auto=format&fit=crop&w=900&q=80" }
      ];

      const grid = document.getElementById("rankingGrid");
      const filterButtons = document.querySelectorAll(".filter-btn");

      function renderItems(filter = "all") {
        const visible = filter === "all" ? items : items.filter(item => item.category === filter);
        grid.innerHTML = visible.map(item => `
          <article class="card">
            <div class="card-top">
              <div class="rank-badge">#${item.rank}</div>
              <div class="trend ${item.trend === "down" ? "down" : ""}">${item.trend === "up" ? "▲ 上昇" : "▼ 下落"}</div>
            </div>

            <div class="character-art">
              <img src="${item.image}" alt="${item.name}" />
              <div class="art-label">${item.label}</div>
            </div>

            <h3>${item.name}</h3>
            <div class="meta">
              <span>${item.votes.toLocaleString()}票</span>
              <span class="score">${item.score}</span>
            </div>

            <div class="tags">${item.tags.map(tag => `<span class="tag">${tag}</span>`).join("")}</div>

            <div class="card-footer">
              <small>カテゴリ: ${item.category}</small>
              <button class="detail-btn">詳細</button>
            </div>
          </article>
        `).join("");
      }

      filterButtons.forEach(button => {
        button.addEventListener("click", () => {
          filterButtons.forEach(btn => btn.classList.remove("active"));
          button.classList.add("active");
          renderItems(button.dataset.filter);
        });
      });

      renderItems();
    </script>
  </body>
</html>
